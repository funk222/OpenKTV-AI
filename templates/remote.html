<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KTV Remote</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: sans-serif; padding: 10px; margin: 0; }
        .btn { width: 100%; padding: 15px; margin: 5px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; }
        .play { background: #009688; }
        .pause { background: #2196F3; }
        .stop { background: #F44336; }
        .vocal { background: #FF9800; color: black; }
        .inst { background: #FFC107; color: black; }
        .admin-link { background: #607D8B; color: white; text-align: center; display: block; padding: 10px; text-decoration: none; border-radius: 5px; margin-bottom: 10px; }
        input[type=text] { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; background: #333; border: 1px solid #555; color: white; border-radius: 5px;}
        input[type=range] { width: 100%; margin: 10px 0; }
        li { background: #333; padding: 10px; margin-bottom: 5px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        ul { list-style: none; padding: 0; }
        .song-btn { background: #009688; border: none; padding: 5px 15px; border-radius: 20px; color: white; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div style="text-align:center; margin-bottom:10px;">
        <h3 style="margin:0;">📱 KTV Remote</h3>
        <small style="color:#aaa;">Connected to host</small>
    </div>

    <a href="/admin" class="admin-link">⚙️ Open Admin (add/manage songs)</a>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
        <button class="btn pause" onclick="cmd('pause')">⏯ Play / Pause</button>
        <button class="btn stop" onclick="cmd('stop')">⏹ Skip</button>
        <button class="btn vocal" onclick="track('original')">🎤 Original</button>
        <button class="btn inst" onclick="track('instrumental')">🚫 Instrumental</button>
    </div>

    <div style="background: #2a2a2a; padding: 15px; border-radius: 8px; margin-top: 10px; margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 5px; color: #ccc; font-size: 14px;">
            <span>🔊 Volume</span><span id="vol-val">100%</span>
        </div>
        <input type="range" id="vol" min="0" max="2" step="0.1" value="1" oninput="updateEffect()">
    </div>

    <div style="background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #ccc; font-size: 14px;">
            <span>🎵 Key Shift</span><span id="key-val">Original Key (0)</span>
        </div>
        <div style="display: flex; gap: 8px;">
            <button class="btn" style="background:#555; flex:1; padding: 12px; margin: 0;" onclick="changeKey(-1)">🔻 Down</button>
            <button class="btn" style="background:#777; flex:1; padding: 12px; margin: 0;" onclick="changeKey(0)">0 (Original)</button>
            <button class="btn" style="background:#555; flex:1; padding: 12px; margin: 0;" onclick="changeKey(1)">🔺 Up</button>
        </div>
    </div>

    <div style="background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #ccc; font-size: 14px;">
            <span>⏱ Jump To Time</span><span>mm:ss</span>
        </div>
        <div style="display:flex; gap:8px;">
            <input type="text" id="seek-input" placeholder="01:30" style="margin:0; flex:1;">
            <button class="btn" style="background:#3f51b5; width:auto; padding: 0 16px; margin:0;" onclick="jumpToTimeInput()">Jump</button>
        </div>
    </div>

    <hr style="border-color: #333;">
    
    <input type="text" id="search" placeholder="🔍 Search songs..." oninput="filter()">
    <ul id="list"></ul>

    <script>
        const socket = io();
        let allSongs = [];
        let currentKey = 0;

        socket.on('update_list', (songs) => {
            allSongs = songs;
            filter();
        });

        function filter() {
            const key = document.getElementById('search').value.toLowerCase();
            const list = document.getElementById('list');
            list.innerHTML = "";
            
            allSongs.filter(s => s.toLowerCase().includes(key)).forEach(s => {
                list.innerHTML += `
                    <li>
                        <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:60%;">${s}</span>
                        <button class="song-btn" onclick="play('${s}')">Play</button>
                    </li>`;
            });
        }

        function play(filename) { socket.emit('request_play', {filename: filename}); }
        function cmd(action) { socket.emit('control', action); }
        function track(mode) { socket.emit('change_track', mode); }

        function parseTimeInput(raw) {
            const parts = String(raw || '').trim().split(':').map(p => p.trim());
            if (!parts.length || parts.some(p => p === '' || Number.isNaN(Number(p)))) return null;
            if (parts.length === 1) return Number(parts[0]);
            if (parts.length === 2) return Number(parts[0]) * 60 + Number(parts[1]);
            if (parts.length === 3) return Number(parts[0]) * 3600 + Number(parts[1]) * 60 + Number(parts[2]);
            return null;
        }

        function jumpToTimeInput() {
            const input = document.getElementById('seek-input');
            const seconds = parseTimeInput(input.value);
            if (seconds === null) {
                alert('Use mm:ss or hh:mm:ss');
                return;
            }
            socket.emit('seek_to', { seconds: Math.max(0, seconds) });
            input.value = '';
        }

        function loadList() {
            fetch('/api/list').then(r => r.json()).then(data => {
                allSongs = data;
                filter();
            });
        }
        
        loadList();
        socket.on('refresh_list', loadList);

        // --- 音效與升降 KEY 控制 ---
        function updateEffect() {
            const vol = parseFloat(document.getElementById('vol').value);
            socket.emit('control_effect', { volume: vol });
        }

        function changeKey(step) {
            if (step === 0) {
                currentKey = 0;
            } else {
                currentKey += step;
            }
            
            if(currentKey > 12) currentKey = 12;
            if(currentKey < -12) currentKey = -12;
            
            socket.emit('control_effect', { pitch: currentKey });
        }

        socket.on('apply_effect', (data) => {
            if (data.pitch !== undefined) {
                currentKey = data.pitch;
                document.getElementById('key-val').innerText = currentKey === 0 ? "Original Key (0)" : (currentKey > 0 ? "+" + currentKey : currentKey);
            }
            if (data.volume !== undefined) {
                document.getElementById('vol').value = data.volume;
                document.getElementById('vol-val').innerText = Math.round(data.volume * 100) + "%";
            }
        });
    </script>
</body>
</html>
